
name: Build Magpie

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: "Compiler"
        required: true
        default: "MSVC"
        type: choice
        options:
          - MSVC
          - ClangCL

      platform:
        description: "Target platform"
        required: true
        default: "x64"
        type: choice
        options:
          - x64
          - ARM64

  push:
    paths:
      - ".github/workflows/build.yml"
      - "Magpie.slnx"
      - "*.props"
      - "scripts/publish.py"
      - "src/**"

  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "Magpie.slnx"
      - "*.props"
      - "scripts/publish.py"
      - "src/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.compiler || 'MSVC' }} ${{ inputs.platform || 'x64' }}
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan
          conan --version

      - name: Cache Conan dependencies
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('src/**/conanfile.txt') }}-${{ inputs.compiler || 'MSVC' }}-${{ inputs.platform || 'x64' }}

      - name: Build Magpie
        shell: pwsh
        env:
          BUILD_COMPILER: ${{ inputs.compiler || 'MSVC' }}
          BUILD_PLATFORM: ${{ inputs.platform || 'x64' }}
        run: |
          python scripts/publish.py --compiler=$env:BUILD_COMPILER --platform=$env:BUILD_PLATFORM

      - name: Get commit hash
        id: hash
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          "sha_short=$sha" >> $env:GITHUB_OUTPUT

      - name: Upload Magpie build
        uses: actions/upload-artifact@v4
        with:
          name: Magpie-${{ steps.hash.outputs.sha_short }}-${{ inputs.compiler || 'MSVC' }}-${{ inputs.platform || 'x64' }}
          path: publish/${{ inputs.platform || 'x64' }}/
          if-no-files-found: error
          retention-days: 30
